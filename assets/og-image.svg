<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ff2a85"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="8" fill="url(#accent)"/>

  <!-- Grid Glow Lines -->
  <circle cx="1050" cy="150" r="300" fill="#00f0ff" opacity="0.08" filter="blur(60px)"/>
  <circle cx="150" cy="500" r="250" fill="#ff2a85" opacity="0.07" filter="blur(60px)"/>

  <!-- Badge -->
  <rect x="90" y="90" width="280" height="42" rx="21" fill="#1b2438" stroke="#00f0ff" stroke-width="1.5"/>
  <text x="230" y="117" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#00f0ff" text-anchor="middle">⚡ GAMING UTILITY TOOL</text>

  <!-- Title -->
  <text x="90" y="220" font-family="-apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">GTA 6 ONLINE</text>
  <text x="90" y="295" font-family="-apple-system, sans-serif" font-size="58" font-weight="900" fill="#00f0ff" letter-spacing="-1">PAYOUT &amp; HEIST CALCULATOR</text>

  <!-- Subtitle -->
  <text x="90" y="365" font-family="-apple-system, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Instant Heist Cuts • $/Hour Grind Rankings • Goal Savings Tracker</text>

  <!-- Stat Cards Preview -->
  <g transform="translate(90, 420)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="235" height="130" rx="12" fill="#151d2d" stroke="#1f2a40"/>
    <text x="24" y="38" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#94a3b8">LEADER TAKE (40%)</text>
    <text x="24" y="85" font-family="-apple-system, sans-serif" font-size="34" font-weight="900" fill="#00f0ff">$720,000</text>
    <text x="24" y="110" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748b">After 10% Fence Fee</text>

    <!-- Card 2 -->
    <rect x="255" y="0" width="235" height="130" rx="12" fill="#151d2d" stroke="#1f2a40"/>
    <text x="279" y="38" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#94a3b8">CREW CUT (20% EACH)</text>
    <text x="279" y="85" font-family="-apple-system, sans-serif" font-size="34" font-weight="900" fill="#00e676">$360,000</text>
    <text x="279" y="110" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748b">Per Player Take</text>

    <!-- Card 3 -->
    <rect x="510" y="0" width="235" height="130" rx="12" fill="#151d2d" stroke="#1f2a40"/>
    <text x="534" y="38" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#94a3b8">PROFITABILITY</text>
    <text x="534" y="85" font-family="-apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffb703">$3.26M/hr</text>
    <text x="534" y="110" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748b">Rank #1 Solo Method</text>

    <!-- Card 4 -->
    <rect x="765" y="0" width="255" height="130" rx="12" fill="#151d2d" stroke="#1f2a40"/>
    <text x="789" y="38" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#94a3b8">PLATFORM</text>
    <text x="789" y="80" font-family="-apple-system, sans-serif" font-size="26" font-weight="900" fill="#ffffff">MOBILE &amp; CONSOLE</text>
    <text x="789" y="110" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#ff2a85">Zero Sign-Up • Free</text>
  </g>
</svg>
